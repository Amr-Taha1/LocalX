<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Safe fetch descriptor wrapper to prevent "Cannot set property fetch of #<Window> which has only a getter"
      try {
        if (typeof window !== 'undefined' && window.fetch) {
          var _origFetch = window.fetch.bind(window);
          Object.defineProperty(window, 'fetch', {
            get: function () {
              return _origFetch;
            },
            set: function (newFetch) {
              _origFetch = newFetch;
            },
            configurable: true,
            enumerable: true,
          });
        }
      } catch (e) {
        // Fallback gracefully
      }
    </script>
    <title>LocalX</title>
    <meta name="description" content="LocalX - Private family social network." />
    <meta property="og:title" content="LocalX" />
    <meta property="og:description" content="LocalX - Private family social network." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
